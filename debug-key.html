<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Bland AI Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 shadow-2xl">
            <h1 class="text-2xl font-bold text-white mb-6 text-center">
                <i class="fas fa-bug mr-2"></i>Debug Your Bland AI Key
            </h1>
            
            <div class="mb-4">
                <label class="block text-white font-medium mb-2">Paste Your Bland AI API Key Here</label>
                <input type="text" id="debug-key" class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-gray-300" 
                       placeholder="Paste your full key here to analyze">
            </div>
            
            <button onclick="debugKey()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl transition-all mb-4">
                <i class="fas fa-search mr-2"></i>Analyze Key Format
            </button>
            
            <div id="debug-result" class="hidden p-4 rounded-xl bg-gray-800/50 text-white text-sm space-y-2"></div>
            
            <div class="mt-6 p-4 bg-yellow-500/20 rounded-xl text-yellow-200 text-sm">
                <strong>Purpose:</strong> This tool will show you exactly what the validation is checking and why it might be failing.
            </div>
        </div>
    </div>
    
    <script>
        function debugKey() {
            const key = document.getElementById('debug-key').value.trim();
            const resultDiv = document.getElementById('debug-result');
            
            if (!key) {
                showDebugResult('Please enter an API key to analyze', 'error');
                return;
            }
            
            let analysis = [];
            analysis.push(`<strong>🔍 Key Analysis:</strong>`);
            analysis.push(`• Length: ${key.length} characters`);
            analysis.push(`• First 20 chars: ${key.substring(0, 20)}...`);
            analysis.push(`• Contains dashes: ${key.includes('-') ? '✅ Yes' : '❌ No'}`);
            analysis.push(`• Alphanumeric test: ${/^[a-zA-Z0-9_-]+$/.test(key) ? '✅ Pass' : '❌ Fail'}`);
            
            if (key.length < 20) {
                analysis.push(`<span class="text-red-300">❌ ISSUE: Key too short (need 20+ characters)</span>`);
            } else {
                analysis.push(`<span class="text-green-300">✅ Length OK</span>`);
            }
            
            if (!key.includes('-')) {
                analysis.push(`<span class="text-red-300">❌ ISSUE: No dashes found</span>`);
            } else {
                analysis.push(`<span class="text-green-300">✅ Contains dashes</span>`);
            }
            
            if (!/^[a-zA-Z0-9_-]+$/.test(key)) {
                analysis.push(`<span class="text-red-300">❌ ISSUE: Contains invalid characters</span>`);
                analysis.push(`Valid chars: a-z, A-Z, 0-9, underscore (_), dash (-)`);
            } else {
                analysis.push(`<span class="text-green-300">✅ Character validation passed</span>`);
            }
            
            // Overall validation
            const isValid = key.length >= 20 && key.includes('-') && /^[a-zA-Z0-9_-]+$/.test(key);
            
            if (isValid) {
                analysis.push(`<div class="mt-4 p-3 bg-green-600/30 rounded-lg text-green-200">`);
                analysis.push(`🎉 <strong>SUCCESS!</strong> This key should work with the authentication system.`);
                analysis.push(`</div>`);
            } else {
                analysis.push(`<div class="mt-4 p-3 bg-red-600/30 rounded-lg text-red-200">`);
                analysis.push(`❌ <strong>FAILED:</strong> This key format won't pass validation.`);
                analysis.push(`</div>`);
            }
            
            resultDiv.innerHTML = analysis.join('<br>');
            resultDiv.classList.remove('hidden');
        }
        
        function showDebugResult(message, type) {
            const resultDiv = document.getElementById('debug-result');
            resultDiv.innerHTML = message;
            resultDiv.className = `p-4 rounded-xl ${type === 'success' ? 'bg-green-500/20 text-green-200' : 'bg-red-500/20 text-red-200'}`;
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
