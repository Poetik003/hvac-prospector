<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Live Calling - ProSpector Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #020617 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }
        
        .max-w-md {
            max-height: none !important;
            height: auto !important;
        }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-600">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-phone text-2xl text-green-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Direct Live Calling</h1>
            <p class="text-slate-300 text-sm">Make real AI-powered phone calls</p>
        </div>

        <!-- Lead Information Form -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Lead Name</label>
                <input type="text" id="lead-name" value="John Smith" 
                       class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-green-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Company</label>
                <input type="text" id="company" value="ABC Corp" 
                       class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-green-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Industry</label>
                <select id="industry" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-green-500">
                    <option value="hvac">HVAC Services</option>
                    <option value="solar">Solar Energy</option>
                    <option value="roofing">Roofing</option>
                    <option value="insurance">Insurance</option>
                    <option value="real_estate">Real Estate</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Phone Number</label>
                <input type="tel" id="phone" value="(786) 614-4925" placeholder="(xxx) xxx-xxxx"
                       class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-green-500">
            </div>
        </div>

        <!-- Call Status Display -->
        <div id="call-status" class="hidden bg-slate-700/50 border border-slate-600 rounded-lg p-4 mb-6">
            <div class="flex items-center space-x-3">
                <div id="status-icon" class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <div class="flex-grow">
                    <p id="status-text" class="text-sm font-medium text-white">Initiating call...</p>
                    <p id="status-detail" class="text-xs text-slate-400">Please wait</p>
                </div>
                <div id="call-timer" class="text-xs text-slate-400">00:00</div>
            </div>
        </div>

        <!-- Call Actions -->
        <div class="space-y-3">
            <button id="start-call-btn" onclick="startCall()" 
                    class="w-full py-4 px-6 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold text-lg transition-colors">
                <i class="fas fa-phone mr-2"></i>Start Live Call
            </button>
            
            <button id="end-call-btn" onclick="endCall()" 
                    class="hidden w-full py-4 px-6 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold text-lg transition-colors">
                <i class="fas fa-phone-slash mr-2"></i>End Call
            </button>
        </div>

        <!-- Instructions -->
        <div class="mt-6 bg-blue-500/10 border border-blue-500/30 rounded-lg p-4">
            <div class="flex items-start space-x-3">
                <i class="fas fa-info-circle text-blue-400 mt-1"></i>
                <div>
                    <p class="text-blue-400 font-medium text-sm mb-2">How it works:</p>
                    <ul class="text-slate-300 text-xs space-y-1">
                        <li>• Fill in lead information above</li>
                        <li>• Click "Start Live Call" button</li>
                        <li>• Your phone will ring with AI voice</li>
                        <li>• Test real conversations and responses</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let callActive = false;
        let callStartTime = null;
        let callInterval = null;

        // Phone number auto-formatting
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove all non-digits
            let formattedValue = '';
            
            if (value.length > 0) {
                if (value.length <= 3) {
                    formattedValue = `(${value}`;
                } else if (value.length <= 6) {
                    formattedValue = `(${value.slice(0, 3)}) ${value.slice(3)}`;
                } else {
                    formattedValue = `(${value.slice(0, 3)}) ${value.slice(3, 6)}-${value.slice(6, 10)}`;
                }
            }
            
            e.target.value = formattedValue;
        });

        // Auto-format on page load
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('phone');
            const currentValue = phoneInput.value.replace(/\D/g, '');
            if (currentValue.length === 10) {
                phoneInput.value = `(${currentValue.slice(0, 3)}) ${currentValue.slice(3, 6)}-${currentValue.slice(6, 10)}`;
            }
        });

        function startCall() {
            console.log('📞 Starting direct live call...');
            
            const leadName = document.getElementById('lead-name').value || 'John Smith';
            const company = document.getElementById('company').value || 'ABC Corp';
            const industry = document.getElementById('industry').value || 'hvac';
            const phoneNumber = document.getElementById('phone').value || '(786) 614-4925';
            
            // Show call status
            const statusDiv = document.getElementById('call-status');
            const statusText = document.getElementById('status-text');
            const statusDetail = document.getElementById('status-detail');
            const statusIcon = document.getElementById('status-icon');
            
            statusDiv.classList.remove('hidden');
            statusText.textContent = 'Initiating call...';
            statusDetail.textContent = `Calling ${leadName} at ${phoneNumber}`;
            statusIcon.className = 'w-3 h-3 bg-yellow-500 rounded-full animate-pulse';
            
            // Switch buttons
            document.getElementById('start-call-btn').classList.add('hidden');
            document.getElementById('end-call-btn').classList.remove('hidden');
            
            // Industry-specific scripts
            const scripts = {
                hvac: `Hello ${leadName}, this is Sarah from HVAC Services. I'm calling ${company} because we're offering a special promotion on energy-efficient HVAC systems in your area. Do you have just 2 minutes for me to share how this could save you hundreds on your energy bills?`,
                solar: `Hi ${leadName}, this is Sarah calling about solar energy savings for ${company}. We're helping businesses reduce their electricity costs by up to 70%. Do you have a moment to learn how this could benefit you?`,
                roofing: `Hello ${leadName}, this is Sarah from Premium Roofing. I'm reaching out to ${company} about complimentary roof inspections in your area. Could I have 2 minutes to explain how we can protect your property?`,
                insurance: `Hi ${leadName}, this is Sarah calling about updated insurance options for ${company}. We're helping businesses save significantly while getting better protection. Do you have a moment?`,
                real_estate: `Hello ${leadName}, this is Sarah calling about current market opportunities for ${company}. We're seeing exceptional conditions right now. Could I share a quick update?`
            };
            
            const callData = {
                phone_number: phoneNumber,
                script_text: scripts[industry] || scripts.hvac,
                lead_name: leadName,
                company: company,
                industry: industry,
                voice_type: 'sarah'
            };
            
            // Make API call to voice server (try multiple endpoints)
            const apiUrl = window.location.protocol === 'https:' 
                ? 'https://8001-in729du0qi04ve0ijwlzw-6532622b.e2b.dev/api/place-phone-call'
                : 'http://localhost:8001/api/place-phone-call';
                
            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                mode: 'cors',
                body: JSON.stringify(callData)
            })
            .then(response => {
                console.log('📡 Response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('✅ API Response:', data);
                if (data.success) {
                    callActive = true;
                    callStartTime = Date.now();
                    
                    statusText.textContent = 'Call Connected';
                    statusDetail.textContent = `Live call in progress with ${leadName}`;
                    statusIcon.className = 'w-3 h-3 bg-green-500 rounded-full animate-pulse';
                    
                    startTimer();
                    console.log('🎉 Live call successfully initiated!');
                } else {
                    throw new Error(data.error || 'Failed to place call');
                }
            })
            .catch(error => {
                console.error('❌ Error:', error);
                statusText.textContent = 'Call Failed';
                statusDetail.textContent = `Error: ${error.message}`;
                statusIcon.className = 'w-3 h-3 bg-red-500 rounded-full';
                
                setTimeout(endCall, 3000);
            });
        }

        function endCall() {
            console.log('🛑 Ending call...');
            
            callActive = false;
            if (callInterval) {
                clearInterval(callInterval);
                callInterval = null;
            }
            
            document.getElementById('call-status').classList.add('hidden');
            document.getElementById('start-call-btn').classList.remove('hidden');
            document.getElementById('end-call-btn').classList.add('hidden');
        }

        function startTimer() {
            const timerElement = document.getElementById('call-timer');
            
            callInterval = setInterval(() => {
                if (callStartTime) {
                    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
