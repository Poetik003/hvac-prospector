<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Button Test</title>
</head>
<body>
    <h1>Basic Button Test</h1>
    <button onclick="testFunction()">🧪 Test Button</button>
    <button onclick="readScriptDirectly()">📢 Read Script</button>
    <button onclick="readScriptWithVoice()">🎤 Smart Voice</button>

    <script>
        function testFunction() {
            alert('✅ Basic button works!');
        }
        
        function readScriptDirectly() {
            alert('✅ Read Script function called!');
        }
        
        function readScriptWithVoice() {
            alert('✅ Smart Voice function called!');
        }
        
        console.log('✅ JavaScript loaded successfully');
    </script>
</body>
</html>
