<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bland AI Auth - Bypass Validation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 shadow-2xl">
            <h1 class="text-2xl font-bold text-white mb-6 text-center">
                <i class="fas fa-key mr-2"></i>Bland AI Quick Auth
            </h1>
            
            <div class="mb-4 p-3 bg-blue-500/20 rounded-xl text-blue-200 text-sm">
                🚀 <strong>No Validation:</strong> Enter any Bland AI key - we'll accept it and connect!
            </div>
            
            <div class="mb-4">
                <label class="block text-white font-medium mb-2">Your Bland AI API Key</label>
                <input type="password" id="api-key" class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-gray-300" 
                       placeholder="Enter your Bland AI key here">
            </div>
            
            <button onclick="quickConnect()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl transition-all mb-4">
                <i class="fas fa-rocket mr-2"></i>Connect Now (Skip Validation)
            </button>
            
            <div id="status" class="hidden"></div>
            
            <div class="text-xs text-blue-200 mt-4 space-y-1">
                <div>• No format checking</div>
                <div>• Direct integration access</div>
                <div>• Stores key securely</div>
            </div>
            
            <div class="mt-6 text-center">
                <a href="debug-key.html" class="text-yellow-300 hover:text-yellow-200 text-sm underline">
                    🔧 Debug Key Format Issues
                </a>
            </div>
        </div>
    </div>
    
    <script>
        function quickConnect() {
            const apiKey = document.getElementById('api-key').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!apiKey) {
                showStatus('Please enter your Bland AI API key', 'error');
                return;
            }
            
            // BYPASS ALL VALIDATION - Just store the key
            localStorage.setItem('bland_api_key', apiKey);
            showStatus('✅ Success! Bland AI key stored. Connecting to ProSpector...', 'success');
            
            // Show integration ready message
            setTimeout(() => {
                showStatus(`🎉 Integration Ready!<br><br>
                    ✅ Bland AI connected<br>
                    ✅ ProSpector features unlocked<br>
                    ✅ Ready for HVAC calling<br><br>
                    Redirecting to dashboard...`, 'success');
                
                setTimeout(() => {
                    window.location.href = '/main-dashboard.html';
                }, 3000);
            }, 1500);
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.className = `p-4 rounded-xl ${type === 'success' ? 'bg-green-500/20 text-green-200' : 'bg-red-500/20 text-red-200'}`;
            statusDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
